<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Phantom Vault</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="page">

        <main id="unlock-screen">
            <h1>Phantom Vault</h1>

            <span class="lock-icon">🔒</span>

            <p>
                Phantom Vault is a secure and private storage
                solution for your sensitive data.
            </p>

            <input
                id="passkey"
                type="password"
                placeholder="Enter your Passkey"
                autocomplete="current-password"
            >

            <button id="access-button">
                Access Vault
            </button>

            <button id="forgot-password">
                Forgot passkey?
            </button>
        </main>

        <main id="vault-screen">
            <header class="vault-header">
                <div>
                    <h2>Your Vault</h2>
                    <p class="vault-subtitle">
                        Your files are encrypted locally.
                    </p>
                </div>

                <button id="lock-button">
                    Lock
                </button>
            </header>

            <section class="vault-content">
                <button id="upload-button" class="upload-button">
                    + Add Files
                </button>

                <input
                    id="file-input"
                    type="file"
                    multiple
                    hidden
                >

                <div id="file-list"></div>

                <div class="empty-vault">
                    <div class="empty-icon">🔐</div>

                    <h3>Your vault is empty</h3>

                    <p>
                        Add a file to encrypt and store it
                        securely in your browser.
                    </p>

                    <button id="empty-upload-button">
                        Add your first file
                    </button>
                </div>
            </section>
        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
